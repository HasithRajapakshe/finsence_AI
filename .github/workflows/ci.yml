name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/api-gateway
          - services/orchestrator
          - services/kyc-agent
          - services/credit-scoring-agent
          - services/fraud-aml-agent
          - services/compliance-agent
          - services/support-agent
          - services/reporting-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements.txt
      - name: Import check
        working-directory: ${{ matrix.service }}
        run: python -c "import app.main"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
